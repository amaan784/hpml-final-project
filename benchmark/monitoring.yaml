# vLLM monitoring stack ??? Prometheus + Grafana
# Applied via: kubectl apply -f benchmark/monitoring.yaml (if on GKE)
# or copied to VM: scp benchmark/monitoring.yaml vm:/tmp/
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-monitoring
data:
  prometheus.yml: |
    scrape_configs:
      - job_name: vllm
        scrape_interval: 15s
        static_configs:
          - targets: ["localhost:8000"]
    metrics_path: /metrics
  grafana-dashboard.json: |
    {"title": "vLLM HPML Dashboard", "panels": []}
